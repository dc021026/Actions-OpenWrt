#
# Based on https://github.com/P3TERX/Actions-OpenWrt
# Modified for Xiaomi Mi Router CR660X
#
# File: .github/workflows/build-cr660x.yml
# Description: Build OpenWrt firmware for CR660X using GitHub Actions
#

name: Build CR660X Firmware

on:
  repository_dispatch:
  workflow_dispatch:
    inputs:
      device:
        description: 'Device model'
        required: false
        default: 'cr660x'
        type: choice
        options:
          - cr660x
          - ac2100
  push:
    branches:
      - master
    paths:
      - 'target/linux/ramips/**'
      - '.github/workflows/build-cr660x.yml'
  schedule:
    - cron: '0 2 * * *'

env:
  REPO_URL: https://github.com/coolsnowwolf/lede
  REPO_BRANCH: master
  FEEDS_CONF: feeds.conf.default
  CONFIG_FILE: .config
  DIY_P1_SH: diy-part1.sh
  DIY_P2_SH: diy-part2.sh
  DEVICE_MODEL: xiaomi_mi-router-cr660x
  UPLOAD_BIN_DIR: false
  UPLOAD_FIRMWARE: true
  UPLOAD_RELEASE: true
  TZ: Asia/Shanghai

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout
      uses: actions/checkout@main

    - name: Determine device
      id: device
      run: |
        if [ "${{ github.event.inputs.device }}" == "ac2100" ]; then
          echo "model=xiaomi_mi-router-ac2100" >> $GITHUB_OUTPUT
          echo "name=AC2100" >> $GITHUB_OUTPUT
        else
          echo "model=xiaomi_mi-router-cr660x" >> $GITHUB_OUTPUT
          echo "name=CR660X" >> $GITHUB_OUTPUT
        fi

    - name: Initialization environment
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        sudo rm -rf /etc/apt/sources.list.d/* /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
        sudo docker image prune --all --force
        sudo -E apt-get -qq update
        sudo -E apt-get -qq install ack antlr3 asciidoc autoconf automake autopoint binutils bison build-essential bzip2 ccache cmake cpio curl device-tree-compiler fastjar flex gawk gettext gcc-multilib g++-multilib git gperf haveged help2man intltool libc6-dev-i386 libelf-dev libfuse-dev libglib2.0-dev libgmp3-dev libltdl-dev libmpc-dev libmpfr-dev libncurses5-dev libncursesw5-dev libpython3-dev libreadline-dev libssl-dev libtool llvm lrzsz libnsl-dev ninja-build p7zip p7zip-full patch pkgconf python3 python3-pyelftools python3-setuptools qemu-utils rsync scons squashfs-tools subversion swig texinfo uglifyjs upx-ucl unzip vim wget xmlto xxd xz-utils zlib1g-dev
        sudo -E apt-get -qq autoremove --purge
        sudo -E apt-get -qq clean
        sudo timedatectl set-timezone "$TZ"
        sudo mkdir -p /workdir
        sudo chown $USER:$GROUPS /workdir

    - name: Clone source code
      working-directory: /workdir
      run: |
        df -hT $PWD
        git clone $REPO_URL -b $REPO_BRANCH openwrt
        ln -sf /workdir/openwrt $GITHUB_WORKSPACE/openwrt
        cd openwrt
        echo "OPENWRT_ROOT=$PWD" >> $GITHUB_ENV

    - name: Load custom feeds
      run: |
        [ -e $FEEDS_CONF ] && mv $FEEDS_CONF openwrt/feeds.conf.default
        chmod +x $DIY_P1_SH
        cd openwrt
        $GITHUB_WORKSPACE/$DIY_P1_SH

    - name: Update feeds
      run: cd openwrt && ./scripts/feeds update -a

    - name: Install feeds
      run: cd openwrt && ./scripts/feeds install -a

    - name: Load custom configuration
      run: |
        [ -e files ] && mv files openwrt/files
        [ -e $CONFIG_FILE ] && mv $CONFIG_FILE openwrt/.config
        chmod +x $DIY_P2_SH
        cd openwrt
        $GITHUB_WORKSPACE/$DIY_P2_SH

    - name: Generate CR660X config
      if: success()
      run: |
        cd openwrt
        cat >> .config << 'EOF'
        CONFIG_TARGET_ramips=y
        CONFIG_TARGET_ramips_mt7621=y
        CONFIG_TARGET_ramips_mt7621_DEVICE_${{ steps.device.outputs.model }}=y
        CONFIG_DEFAULT_TARGET_OPTIMIZATION="-O2 -march=octeon -mtune=octeon"
        CONFIG_DEFAULT_PACKAGE_KMOD_MT7915_FIRMWARE=y
        CONFIG_DEFAULT_PACKAGE_WPAD_OPENSSL=y
        CONFIG_DEFAULT_PACKAGE_UBOOT_ENVTOOLS=y
        CONFIG_PACKAGE_luci=y
        CONFIG_PACKAGE_luci-i18n-base-zh-cn=y
        EOF
        make defconfig

    - name: Download package
      id: package
      run: |
        cd openwrt
        make download -j8 V=s
        find dl -size -1024c -exec ls -l {} \;
        find dl -size -1024c -exec rm -f {} \;

    - name: Compile the firmware
      id: compile
      run: |
        cd openwrt
        echo -e "$(nproc) thread compile"
        make -j$(nproc) || make -j1 || make -j1 V=s
        echo "status=success" >> $GITHUB_OUTPUT
        grep '^CONFIG_TARGET.*DEVICE.*=y' .config | sed -r 's/.*DEVICE_(.*)=y/\1/' > DEVICE_NAME
        [ -s DEVICE_NAME ] && echo "DEVICE_NAME=_$(cat DEVICE_NAME)" >> $GITHUB_ENV
        echo "FILE_DATE=_$(date +"%Y%m%d%H%M")" >> $GITHUB_ENV

    - name: Check space usage
      if: (!cancelled())
      run: df -hT

    - name: Upload bin directory
      uses: actions/upload-artifact@main
      if: steps.compile.outputs.status == 'success' && env.UPLOAD_BIN_DIR == 'true'
      with:
        name: OpenWrt_bin${{ env.DEVICE_NAME }}${{ env.FILE_DATE }}
        path: openwrt/bin
        retention-days: 30

    - name: Organize files
      id: organize
      if: env.UPLOAD_FIRMWARE == 'true' && !cancelled()
      run: |
        cd openwrt/bin/targets/*/*
        rm -rf packages
        echo "FIRMWARE=$PWD" >> $GITHUB_ENV
        echo "status=success" >> $GITHUB_OUTPUT

    - name: Upload firmware directory
      uses: actions/upload-artifact@main
      if: steps.organize.outputs.status == 'success' && !cancelled()
      with:
        name: OpenWrt_firmware${{ env.DEVICE_NAME }}${{ env.FILE_DATE }}
        path: ${{ env.FIRMWARE }}
        retention-days: 30

    - name: Generate release tag
      id: tag
      if: env.UPLOAD_RELEASE == 'true' && !cancelled()
      run: |
        echo "release_tag=CR660X-$(date +"%Y.%m.%d-%H%M")" >> $GITHUB_OUTPUT
        touch release.txt
        cat >> release.txt << 'EOF'
        ## CR660X Firmware Release
        
        ### Device Information
        - **Device**: Xiaomi Mi Router CR660X
        - **SoC**: MediaTek MT7621
        - **Flash**: NAND 256MB
        - **RAM**: 512MB
        
        ### Build Information
        - **Repo**: coolsnowwolf/lede
        - **Branch**: master
        - **Build Time**: $(date '+%Y-%m-%d %H:%M:%S')
        
        ### Installation Instructions
        
        #### First Time Installation (Factory)
        1. Access router's web interface or use Xiaomi's official tool
        2. Upload `*factory.bin` image
        3. Wait for reboot
        
        #### Upgrade from OpenWrt
        1. SSH: `ssh root@192.168.1.1`
        2. Upload: `scp *sysupgrade.tar root@192.168.1.1:/tmp/`
        3. Execute: `cd /tmp && sysupgrade -n *sysupgrade.tar`
        
        ### Default Settings
        - **IP Address**: 192.168.1.1
        - **Username**: root
        - **Password**: password
        
        ### Included Packages
        - kmod-mt7915-firmware (WiFi 6 support)
        - wpad-openssl (WiFi authentication)
        - uboot-envtools (U-Boot environment)
        - LuCI (Web interface)
        - Chinese localization
        
        ### Verification
        Use SHA256SUMS to verify file integrity:
        ```bash
        sha256sum -c SHA256SUMS
        ```
        
        EOF
        echo "status=success" >> $GITHUB_OUTPUT

    - name: Upload firmware to release
      uses: softprops/action-gh-release@master
      if: steps.tag.outputs.status == 'success' && !cancelled()
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: ${{ steps.tag.outputs.release_tag }}
        body_path: release.txt
        files: ${{ env.FIRMWARE }}/*

    - name: Delete workflow runs
      uses: Mattraks/delete-workflow-runs@main
      with:
        retain_days: 0
        keep_minimum_runs: 2

    - name: Remove old Releases
      uses: dev-drprasad/delete-older-releases@master
      if: env.UPLOAD_RELEASE == 'true' && !cancelled()
      with:
        keep_latest: 3
        delete_tags: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
